<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babygirl</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f5f5f5;
            font-family:Arial, Helvetica, sans-serif;
        }

        .box{
            width: 500px ;
            height: auto;
            padding:25px;
            background:white;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
            text-align:center;
        }

        .buttons{
            margin-top:20px;
            display:flex;
            justify-content:center;
            gap:15px;
        }

        #yesbtn{
            background-color:#0d6efd;
            color:white;
            border:none;
            padding:10px 30px;
            border-radius:12px;
            cursor:pointer;
            transition:transform 0.3s ease;
        }

        #nobtn{
            background-color:#dc3545;
            color:white;
            border:none;
            padding:10px 30px;
            border-radius:12px;
            cursor:pointer;
        }
    </style>
</head>
<body>

    <div class="box">
        <h3>Will you go out with me? ❤️</h3>

        <div class="buttons">
            <a href="place.html">
                <button id="yesbtn">Yes</button>
            </a>
            <button id="nobtn">No</button>
        </div>
    </div>

    

    <script>
    const noBtn = document.getElementById("nobtn");
    const yesBtn = document.getElementById("yesbtn");
    const heading = document.querySelector("h3");

    let yesScale = 1;
    let firstMove = true;

    noBtn.addEventListener("mouseenter", () => {

        // On first hover, convert to absolute while keeping its current position
        if (firstMove) {
            const rect = noBtn.getBoundingClientRect();

            noBtn.style.position = "absolute";
            noBtn.style.left = rect.left + "px";
            noBtn.style.top = rect.top + "px";

            firstMove = false;
        }

        const maxX = window.innerWidth - noBtn.offsetWidth;
        const maxY = window.innerHeight - noBtn.offsetHeight;

        noBtn.style.left = Math.random() * maxX + "px";
        noBtn.style.top = Math.random() * maxY + "px";

        yesScale += 0.3;
        yesBtn.style.transform = `scale(${yesScale})`;

        if (yesScale > 1.5) {
            yesBtn.textContent = "Please? 🥺";
        }

        if (yesScale > 2.0) {
            yesBtn.textContent = "Pretty Please? ❤️";
            heading.textContent = "Come on, the answer is obvious 😄";
        }

        if (yesScale > 2.5) {
            yesBtn.textContent = "You Know You Want To 😘";
        }
    });    
    </script>

</body>
</html>
